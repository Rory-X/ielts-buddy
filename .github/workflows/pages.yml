name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 1200000
          error_count: 15

      # 第一次失败，等 30s 让 GitHub Pages 后端冷静一下再重试
      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 1200000
          error_count: 15

      - name: Wait before retry (attempt 3)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 15

      # 汇总：任意一次成功即为成功
      - name: Check deploy result
        if: always()
        run: |
          if [[ "${{ steps.deploy1.outcome }}" == "success" ]] || \
             [[ "${{ steps.deploy2.outcome }}" == "success" ]] || \
             [[ "${{ steps.deploy3.outcome }}" == "success" ]]; then
            echo "✅ Deploy succeeded"
          else
            echo "❌ All 3 attempts failed"
            exit 1
          fi
